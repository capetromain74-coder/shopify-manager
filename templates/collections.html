<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Collections SEO - KP SHOES</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#0a0a0f;color:#fff;min-height:100vh}
.hd{background:#111;padding:15px 20px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:20px;font-weight:bold;color:#00ff88;text-decoration:none}
.stats{display:flex;gap:15px;padding:15px 20px;background:#0d0d14;flex-wrap:wrap}
.st{background:#1a1a2e;padding:12px 20px;border-radius:8px;text-align:center;min-width:100px}
.st .v{font-size:24px;font-weight:bold}
.st .l{font-size:10px;color:#666;margin-top:3px}
.main{max-width:1200px;margin:0 auto;padding:20px}
.toolbar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:200px;padding:10px 15px;background:#1a1a2e;border:1px solid #333;border-radius:8px;color:#fff}
.btn{padding:10px 20px;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:12px}
.filter-btn{padding:6px 14px;background:#1a1a2e;border:1px solid #333;color:#888;border-radius:6px;cursor:pointer;font-size:11px;font-weight:600}
.filter-btn.active{background:#00ff8833;color:#00ff88;border-color:#00ff88}
.filter-btn.red.active{background:#ff475733;color:#ff4757;border-color:#ff4757}
.filter-btn.orange.active{background:#ff9f4333;color:#ff9f43;border-color:#ff9f43}
.msg{padding:12px 20px;border-radius:8px;margin-bottom:15px;font-size:13px;display:none}
.msg.on{display:block}.msg.ok{background:#00ff8815;color:#00ff88}.msg.err{background:#ff475715;color:#ff4757}
table{width:100%;border-collapse:collapse;margin-top:10px}
th{text-align:left;padding:12px 15px;background:#1a1a2e;color:#888;font-size:11px;text-transform:uppercase;border-bottom:1px solid #333}
td{padding:12px 15px;border-bottom:1px solid #1a1a2e;font-size:13px;vertical-align:middle}
tr:hover{background:#111}
.handle{color:#666;font-size:11px;font-family:monospace}
.score-circle{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:12px}
.score-0{background:#ff475733;color:#ff4757}
.score-35{background:#ff9f4333;color:#ff9f43}
.score-70{background:#ffd93d33;color:#ffd93d}
.score-100{background:#00ff8833;color:#00ff88}
.badge{display:inline-block;padding:3px 8px;border-radius:10px;font-size:10px;font-weight:600;margin-right:4px}
.badge.ok{background:#00ff8833;color:#00ff88}
.badge.miss{background:#ff475733;color:#ff4757}
.badge.nodef{background:#33333366;color:#666}
.btn-apply{padding:6px 14px;background:#00ff88;color:#000;border:none;border-radius:6px;font-weight:600;cursor:pointer;font-size:11px}
.btn-apply:disabled{opacity:0.4;cursor:not-allowed}
.btn-apply:hover:not(:disabled){background:#00cc6a}
.btn-apply.applied{background:#333;color:#00ff88}
.spinner-sm{display:inline-block;width:14px;height:14px;border:2px solid #333;border-top-color:#00ff88;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.detail-modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:9999;overflow-y:auto}
.detail-box{max-width:750px;margin:40px auto;background:#1a1a2e;border-radius:12px;padding:30px;color:#fff}
.detail-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.detail-close{background:none;border:none;color:#fff;font-size:24px;cursor:pointer}
.detail-section{margin-bottom:20px}
.detail-section h3{font-size:13px;color:#888;text-transform:uppercase;margin-bottom:8px}
.detail-section .val{background:#111;padding:12px;border-radius:8px;font-size:13px;line-height:1.6;color:#ccc;word-break:break-word}
.check-row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px}
.check-ok{color:#00ff88}.check-miss{color:#ff4757}
.prog-bar{background:#333;border-radius:6px;overflow:hidden;height:8px;margin:15px 0}
.prog-fill{width:0%;height:100%;background:linear-gradient(90deg,#00ff88,#00cc6a);transition:width .3s}
</style>
</head>
<body>
<header class="hd">
<a href="/" class="logo">&larr; KP SHOES</a>
<span style="color:#aaa;font-size:13px">Gestion des Collections</span>
</header>
<div class="stats">
<div class="st"><div class="v" style="color:#fff" id="totalCol">-</div><div class="l">COLLECTIONS</div></div>
<div class="st"><div class="v" style="color:#00ff88" id="seo100">-</div><div class="l">SEO 100%</div></div>
<div class="st"><div class="v" style="color:#ff9f43" id="seoPartial">-</div><div class="l">PARTIEL</div></div>
<div class="st"><div class="v" style="color:#ff4757" id="seo0">-</div><div class="l">SANS SEO</div></div>
<div class="st"><div class="v" style="color:#666" id="noSEODef">-</div><div class="l">PAS D&Eacute;FINI</div></div>
</div>
<main class="main">
<div class="msg" id="msg"></div>
<div class="toolbar">
<input type="text" class="search" id="q" placeholder="Rechercher une collection..." oninput="filterCols()">
<button class="filter-btn active" id="fAll" onclick="setFilter('all')">Toutes</button>
<button class="filter-btn red" id="fTodo" onclick="setFilter('todo')">&#192; faire</button>
<button class="filter-btn orange" id="fPartial" onclick="setFilter('partial')">Partiel</button>
<button class="btn" style="background:#00ff88;color:#000" onclick="applyAll()">&#128640; Appliquer tout</button>
</div>
<div id="batchProg" style="display:none;margin-bottom:15px">
<div class="prog-bar"><div class="prog-fill" id="batchBar"></div></div>
<div id="batchTxt" style="text-align:center;font-size:12px;color:#aaa;margin-top:6px"></div>
</div>
<table>
<thead><tr><th>Collection</th><th>Handle</th><th>Score</th><th>Statut</th><th>Action</th></tr></thead>
<tbody id="tbody"><tr><td colspan="5" style="text-align:center;padding:40px;color:#666"><span class="spinner-sm"></span> Analyse en cours...</td></tr></tbody>
</table>
</main>

<div class="detail-modal" id="detailModal">
<div class="detail-box">
<div class="detail-head">
<h2 style="margin:0;font-size:18px" id="detailTitle">Collection</h2>
<button class="detail-close" onclick="closeDetail()">&times;</button>
</div>
<div id="detailContent"></div>
<div style="display:flex;gap:10px;margin-top:20px">
<button id="detailApplyBtn" class="btn" style="flex:1;padding:12px;background:#00ff88;color:#000;font-size:14px" onclick="applyFromDetail()">&#128640; Appliquer le SEO</button>
<a id="detailLink" href="#" target="_blank" class="btn" style="padding:12px 20px;background:#333;color:#fff;text-decoration:none;text-align:center">Voir sur le site &#8599;</a>
</div>
</div>
</div>

<script>
var cols=[];
var currentFilter="all";

function loadCols(){
    fetch("/api/collections").then(function(r){return r.json()}).then(function(d){
        cols=d.collections||[];
        cols.sort(function(a,b){return a.score-b.score});
        updateStats();
        filterCols();
    });
}

function updateStats(){
    var s100=0,partial=0,s0=0,nodef=0;
    for(var i=0;i<cols.length;i++){
        var c=cols[i];
        if(!c.has_seo_def){nodef++;continue}
        if(c.score>=100)s100++;
        else if(c.score>0)partial++;
        else s0++;
    }
    document.getElementById("totalCol").textContent=cols.length;
    document.getElementById("seo100").textContent=s100;
    document.getElementById("seoPartial").textContent=partial;
    document.getElementById("seo0").textContent=s0;
    document.getElementById("noSEODef").textContent=nodef;
}

function setFilter(f){
    currentFilter=f;
    document.getElementById("fAll").className="filter-btn"+(f==="all"?" active":"");
    document.getElementById("fTodo").className="filter-btn red"+(f==="todo"?" active":"");
    document.getElementById("fPartial").className="filter-btn orange"+(f==="partial"?" active":"");
    filterCols();
}

function getScoreClass(s){
    if(s>=100)return "score-100";
    if(s>=70)return "score-70";
    if(s>0)return "score-35";
    return "score-0";
}

function filterCols(){
    var q=document.getElementById("q").value.toLowerCase();
    var tb=document.getElementById("tbody");
    var html="";
    for(var i=0;i<cols.length;i++){
        var c=cols[i];
        if(q && c.title.toLowerCase().indexOf(q)<0 && c.handle.toLowerCase().indexOf(q)<0) continue;
        if(currentFilter==="todo" && (c.score>=100 || !c.has_seo_def)) continue;
        if(currentFilter==="partial" && (c.score===0 || c.score>=100 || !c.has_seo_def)) continue;

        var scoreClass=getScoreClass(c.score);
        var status="";
        if(!c.has_seo_def){
            status="<span class='badge nodef'>Pas d\u00e9fini</span>";
        }else{
            status+= c.checks.meta_title?"<span class='badge ok'>Title</span>":"<span class='badge miss'>Title</span>";
            status+= c.checks.meta_description?"<span class='badge ok'>Desc</span>":"<span class='badge miss'>Desc</span>";
            status+= c.checks.body_html?"<span class='badge ok'>Body</span>":"<span class='badge miss'>Body</span>";
        }
        var btnText=c.score>=100?"\u2713 OK":"Appliquer";
        var btnClass=c.score>=100?"btn-apply applied":"btn-apply";
        var btnDisabled=!c.has_seo_def?"disabled":"";

        html+="<tr onclick='showDetail("+i+")' style='cursor:pointer'>";
        html+="<td><strong>"+c.title+"</strong></td>";
        html+="<td><span class='handle'>"+c.handle+"</span></td>";
        html+="<td><div class='score-circle "+scoreClass+"'>"+c.score+"</div></td>";
        html+="<td>"+status+"</td>";
        html+="<td><button class='"+btnClass+"' onclick='event.stopPropagation();applySeo("+c.id+",this)' "+btnDisabled+">"+btnText+"</button></td>";
        html+="</tr>";
    }
    if(!html)html="<tr><td colspan='5' style='text-align:center;padding:40px;color:#666'>Aucune collection</td></tr>";
    tb.innerHTML=html;
}

function showDetail(idx){
    var c=cols[idx];
    document.getElementById("detailTitle").textContent=c.title+" ("+c.score+"/100)";
    document.getElementById("detailLink").href="https://kpshoes.fr/collections/"+c.handle;
    var html="";
    html+="<div class='detail-section'><h3>V\u00e9rification SEO</h3><div class='val'>";
    html+="<div class='check-row'><span class='"+(c.checks.meta_title?"check-ok":"check-miss")+"'>"+(c.checks.meta_title?"\u2713":"\u2717")+"</span> <strong>Meta Title</strong>"+(c.live_meta_title?" &mdash; <span style='color:#888;font-size:11px'>"+c.live_meta_title.substring(0,60)+"</span>":"")+"</div>";
    html+="<div class='check-row'><span class='"+(c.checks.meta_description?"check-ok":"check-miss")+"'>"+(c.checks.meta_description?"\u2713":"\u2717")+"</span> <strong>Meta Description</strong>"+(c.live_meta_description?" &mdash; <span style='color:#888;font-size:11px'>"+c.live_meta_description.substring(0,70)+"...</span>":"")+"</div>";
    html+="<div class='check-row'><span class='"+(c.checks.body_html?"check-ok":"check-miss")+"'>"+(c.checks.body_html?"\u2713":"\u2717")+"</span> <strong>Description Body HTML</strong></div>";
    html+="</div></div>";
    if(c.has_seo_def){
        html+="<div class='detail-section'><h3>SEO pr\u00e9par\u00e9</h3><div class='val'>";
        html+="<p><strong>Title:</strong> "+c.seo.meta_title+"</p>";
        html+="<p style='margin-top:8px'><strong>Desc:</strong> "+c.seo.meta_description+"</p>";
        html+="</div></div>";
        document.getElementById("detailApplyBtn").style.display="block";
        document.getElementById("detailApplyBtn").setAttribute("data-id",c.id);
    }else{
        html+="<div style='padding:15px;background:#ff475715;border-radius:8px;color:#ff9f43;font-size:13px'>Aucun SEO d\u00e9fini pour <strong>"+c.handle+"</strong>.</div>";
        document.getElementById("detailApplyBtn").style.display="none";
    }
    document.getElementById("detailContent").innerHTML=html;
    document.getElementById("detailModal").style.display="block";
}

function closeDetail(){document.getElementById("detailModal").style.display="none"}

function applySeo(cid,btn){
    var old=btn.innerHTML;
    btn.innerHTML="<span class='spinner-sm'></span>";btn.disabled=true;
    fetch("/api/collections/"+cid+"/seo",{method:"POST",headers:{"Content-Type":"application/json"}}).then(function(r){return r.json()}).then(function(d){
        if(d.success){btn.innerHTML="\u2713 OK";btn.className="btn-apply applied";showMsg("Collection mise \u00e0 jour !","ok")}
        else{btn.innerHTML="Erreur";btn.style.background="#ff4757";btn.style.color="#fff";showMsg("Erreur: "+(d.error||"inconnue"),"err")}
        setTimeout(function(){btn.disabled=false},2000);
    }).catch(function(e){btn.innerHTML=old;btn.disabled=false;showMsg("Erreur: "+e.message,"err")});
}

function applyFromDetail(){
    var cid=document.getElementById("detailApplyBtn").getAttribute("data-id");
    var btn=document.getElementById("detailApplyBtn");
    btn.innerHTML="<span class='spinner-sm'></span> Application...";btn.disabled=true;
    fetch("/api/collections/"+cid+"/seo",{method:"POST",headers:{"Content-Type":"application/json"}}).then(function(r){return r.json()}).then(function(d){
        if(d.success){btn.innerHTML="\u2713 SEO appliqu\u00e9 !";btn.style.background="#00cc6a";showMsg("Collection mise \u00e0 jour !","ok")}
        else{btn.innerHTML="Erreur";btn.style.background="#ff4757";showMsg("Erreur: "+(d.error||"inconnue"),"err")}
        setTimeout(function(){btn.innerHTML="\ud83d\ude80 Appliquer le SEO";btn.disabled=false;btn.style.background="#00ff88"},2000);
    });
}

function applyAll(){
    var ready=[];
    for(var i=0;i<cols.length;i++){if(cols[i].has_seo_def && cols[i].score<100)ready.push(cols[i])}
    if(!ready.length){showMsg("Toutes les collections sont \u00e0 100% !","ok");return}
    if(!confirm("Appliquer le SEO \u00e0 "+ready.length+" collections ?"))return;
    document.getElementById("batchProg").style.display="block";
    var done=0;
    function next(){
        if(done>=ready.length){
            document.getElementById("batchBar").style.width="100%";
            document.getElementById("batchTxt").textContent="Termin\u00e9 ! "+done+" collections mises \u00e0 jour";
            showMsg(done+" collections mises \u00e0 jour !","ok");
            setTimeout(function(){loadCols()},2000);
            return;
        }
        var c=ready[done];
        document.getElementById("batchTxt").textContent=c.title+" ("+(done+1)+"/"+ready.length+")";
        document.getElementById("batchBar").style.width=Math.round((done+1)/ready.length*100)+"%";
        fetch("/api/collections/"+c.id+"/seo",{method:"POST",headers:{"Content-Type":"application/json"}}).then(function(){done++;setTimeout(next,500)}).catch(function(){done++;setTimeout(next,500)});
    }
    next();
}

function showMsg(txt,type){
    var el=document.getElementById("msg");
    el.textContent=txt;el.className="msg on "+(type||"ok");
    setTimeout(function(){el.className="msg"},4000);
}

loadCols();
</script>
</body>
</html>
