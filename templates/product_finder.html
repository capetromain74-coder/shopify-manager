<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product Finder - KP SHOES</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#f5f5f7;color:#1d1d1f;min-height:100vh}
.hd{background:#ffffff;padding:15px 20px;border-bottom:1px solid #e5e5ea;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:20px;font-weight:bold;color:#248a3d;text-decoration:none}
.main{max-width:1400px;margin:0 auto;padding:20px}
.hero{background:linear-gradient(135deg,#eef5ff,#e9f6ec);border:1px solid #d2d2d7;border-radius:12px;padding:25px;margin-bottom:20px}
.hero h1{font-size:22px;margin-bottom:8px;background:linear-gradient(135deg,#0071e3,#0071e3);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:#6e6e73;font-size:13px;line-height:1.6}
.stats{display:flex;gap:15px;padding:0;margin-bottom:20px;flex-wrap:wrap}
.st{background:#ffffff;padding:14px 20px;border-radius:8px;text-align:center;min-width:120px;border:1px solid #e5e5ea}
.st .v{font-size:26px;font-weight:bold}
.st .l{font-size:10px;color:#86868b;margin-top:3px}
.section{background:#ffffff;border-radius:12px;padding:20px;margin-bottom:20px;border:1px solid #e5e5ea}
.btn{padding:12px 24px;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px;transition:all .2s}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.btn-scan{background:linear-gradient(135deg,#0071e3,#0071e3);color:#ffffff;font-size:15px;padding:14px 30px}
.btn-scan:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 20px #d2d2d7}
.btn-goat{background:linear-gradient(135deg,#ff9500,#d70015);color:#ffffff;font-size:14px;padding:12px 24px}
.btn-goat:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 20px #d2d2d7}
.btn-sm{padding:6px 14px;font-size:11px;border:none;border-radius:6px;cursor:pointer;font-weight:600}
.btn-filter{background:#ffffff;color:#6e6e73;border:1px solid #e5e5ea}
.btn-filter.active{background:#eef5ff;color:#0071e3;border-color:#0071e3}
.prog-bar{background:#e8e8ed;border-radius:6px;overflow:hidden;height:8px;margin:15px 0}
.prog-fill{width:0%;height:100%;background:linear-gradient(90deg,#0071e3,#0071e3);transition:width .3s}
.prog-fill.goat{background:linear-gradient(90deg,#ff9500,#d70015)}
.spinner-sm{display:inline-block;width:16px;height:16px;border:2px solid #e5e5ea;border-top-color:#0071e3;border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.msg{padding:12px 20px;border-radius:8px;margin-bottom:15px;font-size:13px;display:none}
.msg.on{display:block}.msg.ok{background:#e9f6ec;color:#248a3d}.msg.err{background:#fdecec;color:#d70015}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:15px}
.search{flex:1;min-width:200px;padding:10px 15px;background:#ffffff;border:1px solid #e5e5ea;border-radius:8px;color:#1d1d1f;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:#ffffff;border:1px solid #e5e5ea;border-radius:10px;overflow:hidden;transition:border-color .2s}
.card:hover{border-color:#0071e3}
.card img{width:100%;height:160px;object-fit:contain;background:#f5f5f7}
.card-body{padding:12px}
.card-title{font-size:12px;font-weight:600;margin-bottom:4px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-sku{font-size:10px;color:#86868b;font-family:monospace;margin-bottom:6px}
.card-brand{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;background:#eef5ff;color:#0071e3}
.card-goat{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;background:#fff4e5;color:#b25000;margin-left:4px}
.card-actions{padding:8px 12px;border-top:1px solid #e5e5ea;display:flex;gap:6px}
.card-actions a{padding:5px 10px;background:#e8e8ed;color:#1d1d1f;border-radius:5px;text-decoration:none;font-size:10px;font-weight:600}
.card-actions a:hover{background:#0071e3}
.load-more{text-align:center;padding:20px}
#stepStatus{font-size:13px;color:#6e6e73;margin-top:10px;line-height:1.8}
#stepStatus .done{color:#248a3d}
#stepStatus .active{color:#0071e3}
#stepStatus .wait{color:#aeaeb2}
.goat-section{background:#ffffff;border:1px solid #d2d2d7;border-radius:12px;padding:20px;margin-bottom:20px;display:none}
.goat-section h2{color:#b25000;font-size:15px;margin-bottom:6px}
.goat-section p{color:#6e6e73;font-size:12px;margin-bottom:15px;line-height:1.6}
.goat-stats{display:flex;gap:12px;font-size:12px;color:#6e6e73;margin-top:10px;flex-wrap:wrap}
.goat-stats span{background:#f2f2f7;padding:4px 10px;border-radius:6px}
.goat-stats .kept{color:#248a3d}.goat-stats .removed{color:#d70015}.goat-stats .notfound{color:#b25000}
.goat-current{margin-top:8px;font-size:11px;color:#86868b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
</style>
</head>
<body>
<header class="hd">
<a href="/" class="logo">&larr; KP SHOES</a>
<span style="color:#6e6e73;font-size:13px">Product Finder</span>
</header>
<main class="main">
<div class="msg" id="msg"></div>

<div class="hero">
<h1>Produits manquants</h1>
<p>Compare le catalogue WetTheNew avec ton stock KP SHOES. Trouve les sneakers manquantes et v&eacute;rifie les images GOAT.</p>
</div>

<div class="section" id="scanSection">
<div style="display:flex;align-items:center;gap:15px;flex-wrap:wrap">
<button class="btn btn-scan" id="btnScan" onclick="startScan()">Lancer le scan WetTheNew</button>
<span id="scanStatus" style="font-size:13px;color:#6e6e73"></span>
</div>
<div id="scanProg" style="display:none;margin-top:15px">
<div class="prog-bar"><div class="prog-fill" id="scanBar"></div></div>
<div id="stepStatus"></div>
</div>
</div>

<!-- GOAT Scan Section -->
<div class="goat-section" id="goatSection">
<h2>Scan GOAT &mdash; V&eacute;rifier les images</h2>
<p id="goatDesc"></p>
<div style="display:flex;align-items:center;gap:15px;flex-wrap:wrap">
<button class="btn btn-goat" id="btnGoat" onclick="startGoatScan()">Lancer le scan GOAT</button>
<button class="btn" style="background:#e8e8ed;color:#1d1d1f" id="btnStopGoat" onclick="stopGoatScan()" disabled>Stop</button>
<span id="goatStatus" style="font-size:13px;color:#6e6e73"></span>
</div>
<div id="goatProg" style="display:none;margin-top:12px">
<div class="prog-bar"><div class="prog-fill goat" id="goatBar"></div></div>
<div class="goat-stats" id="goatStats"></div>
<div class="goat-current" id="goatCurrent"></div>
</div>
</div>

<div id="resultsSection" style="display:none">
<div class="stats">
<div class="st"><div class="v" style="color:#0071e3" id="wtnTotal">0</div><div class="l">WETHENEW</div></div>
<div class="st"><div class="v" style="color:#248a3d" id="kpTotal">0</div><div class="l">KP SHOES</div></div>
<div class="st"><div class="v" style="color:#d70015" id="missingTotal">0</div><div class="l">MANQUANTS</div></div>
<div class="st"><div class="v" style="color:#248a3d" id="matchTotal">0</div><div class="l">D&Eacute;J&Agrave; EN STOCK</div></div>
</div>

<div class="section">
<div class="toolbar">
<input type="text" class="search" id="q" placeholder="Rechercher un produit manquant..." oninput="filterResults()">
<div style="display:flex;gap:6px;flex-wrap:wrap">
<button class="btn-sm btn-filter active" data-brand="all" onclick="setBrandFilter('all')">Toutes</button>
<button class="btn-sm btn-filter" data-brand="jordan" onclick="setBrandFilter('jordan')">Jordan</button>
<button class="btn-sm btn-filter" data-brand="nike" onclick="setBrandFilter('nike')">Nike</button>
<button class="btn-sm btn-filter" data-brand="adidas" onclick="setBrandFilter('adidas')">Adidas</button>
<button class="btn-sm btn-filter" data-brand="new balance" onclick="setBrandFilter('new balance')">NB</button>
<button class="btn-sm btn-filter" data-brand="yeezy" onclick="setBrandFilter('yeezy')">Yeezy</button>
<button class="btn-sm btn-filter" data-brand="asics" onclick="setBrandFilter('asics')">Asics</button>
<button class="btn-sm btn-filter" data-brand="other" onclick="setBrandFilter('other')">Autres</button>
</div>
</div>
<div id="resultCount" style="font-size:12px;color:#6e6e73;margin-bottom:12px"></div>
<div class="grid" id="productGrid"></div>
<div class="load-more" id="loadMore" style="display:none">
<button class="btn" style="background:#e8e8ed;color:#1d1d1f" onclick="showMore()">Charger plus...</button>
</div>
</div>
</div>
<!-- SKU List -->
<div class="section" id="skuListSection" style="display:none">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
<h2 style="font-size:15px;color:#b25000">Liste des SKU manquants (<span id="skuCount">0</span>)</h2>
<button class="btn" style="background:#e8e8ed;color:#1d1d1f;padding:8px 16px;font-size:12px" onclick="copySkuList()">Copier</button>
</div>
<textarea id="skuTextarea" readonly style="width:100%;height:400px;background:#f5f5f7;color:#248a3d;border:1px solid #e5e5ea;border-radius:8px;padding:12px;font-family:monospace;font-size:12px;resize:vertical;line-height:1.6"></textarea>
</div>

</main>

<script>
var wtnProducts = [];
var kpProducts = [];
var missingProducts = [];
var currentBrand = 'all';
var displayCount = 50;
var goatScanning = false;
var goatAbort = false;

function showMsg(t, type) {
    var e = document.getElementById("msg");
    e.textContent = t;
    e.className = "msg on " + (type || "ok");
    setTimeout(function() { e.className = "msg"; }, 5000);
}

function setStep(steps) {
    var html = '';
    for (var i = 0; i < steps.length; i++) {
        var s = steps[i];
        var cls = s.status === 'done' ? 'done' : s.status === 'active' ? 'active' : 'wait';
        var icon = s.status === 'done' ? '&#9989;' : s.status === 'active' ? '<span class="spinner-sm"></span>' : '&#9898;';
        html += '<div class="' + cls + '">' + icon + ' ' + s.text + '</div>';
    }
    document.getElementById("stepStatus").innerHTML = html;
}

function startScan() {
    var btn = document.getElementById("btnScan");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-sm"></span> Scan en cours...';
    document.getElementById("scanProg").style.display = "block";
    document.getElementById("resultsSection").style.display = "none";
    document.getElementById("goatSection").style.display = "none";

    setStep([
        { text: 'Chargement du catalogue WetTheNew...', status: 'active' },
        { text: 'Chargement de tes produits KP SHOES...', status: 'wait' },
        { text: 'Comparaison des catalogues...', status: 'wait' }
    ]);
    document.getElementById("scanBar").style.width = "10%";

    fetch("/api/competitor/scan-wtn")
        .then(function(r) { return r.json(); })
        .then(function(d) {
            if (d.error) { showMsg("Erreur: " + d.error, "err"); btn.disabled = false; btn.innerHTML = "&#128640; Lancer le scan"; return; }
            wtnProducts = d.products || [];
            setStep([
                { text: wtnProducts.length + ' sneakers WetTheNew', status: 'done' },
                { text: 'Chargement de tes produits KP SHOES...', status: 'active' },
                { text: 'Comparaison des catalogues...', status: 'wait' }
            ]);
            document.getElementById("scanBar").style.width = "40%";
            loadKPProducts(function() {
                setStep([
                    { text: wtnProducts.length + ' sneakers WetTheNew', status: 'done' },
                    { text: kpProducts.length + ' produits KP SHOES', status: 'done' },
                    { text: 'Comparaison en cours...', status: 'active' }
                ]);
                document.getElementById("scanBar").style.width = "80%";
                setTimeout(function() {
                    compareProducts();
                    document.getElementById("scanBar").style.width = "100%";
                    setStep([
                        { text: wtnProducts.length + ' sneakers WetTheNew', status: 'done' },
                        { text: kpProducts.length + ' produits KP SHOES', status: 'done' },
                        { text: missingProducts.length + ' produits manquants !', status: 'done' }
                    ]);
                    btn.innerHTML = "&#9989; Scan termin\u00e9";
                    btn.style.background = "#e8e8ed";
                    btn.style.color = "#248a3d";
                    showResults();
                    // Show GOAT section
                    var withSku = missingProducts.filter(function(p) { return p.sku; }).length;
                    var noSku = missingProducts.length - withSku;
                    document.getElementById("goatDesc").innerHTML =
                        'Scanne les <b>' + missingProducts.length + '</b> produits manquants sur GOAT (Algolia) pour compter les images.<br>' +
                        '<b>' + withSku + '</b> avec SKU (recherche par SKU) + <b>' + noSku + '</b> sans SKU (recherche par nom).<br>' +
                        'Seuls les produits avec <b>2+ images</b> GOAT sont gard&eacute;s.';
                    document.getElementById("goatSection").style.display = "block";
                }, 200);
            });
        })
        .catch(function(e) {
            showMsg("Erreur: " + e.message, "err");
            btn.disabled = false;
            btn.innerHTML = "&#128640; Lancer le scan";
        });
}

function loadKPProducts(callback) {
    kpProducts = [];
    var sinceId = 0;
    function loadPage() {
        fetch("/api/products?since_id=" + sinceId + "&limit=250")
            .then(function(r) { return r.json(); })
            .then(function(d) {
                var batch = d.products || [];
                for (var i = 0; i < batch.length; i++) {
                    var p = batch[i];
                    var sku = (p.variants && p.variants[0]) ? p.variants[0].sku || "" : "";
                    kpProducts.push({ id: p.id, title: p.title, sku: sku, titleNorm: normalizeTitle(p.title) });
                }
                if (batch.length >= 250) {
                    sinceId = batch[batch.length - 1].id;
                    setStep([
                        { text: wtnProducts.length + ' sneakers WetTheNew', status: 'done' },
                        { text: 'Chargement... ' + kpProducts.length + ' produits KP SHOES', status: 'active' },
                        { text: 'Comparaison des catalogues...', status: 'wait' }
                    ]);
                    setTimeout(loadPage, 100);
                } else {
                    callback();
                }
            });
    }
    loadPage();
}

function normalizeTitle(t) {
    return t.toLowerCase().replace(/\s+/g, ' ').replace(/[''""]/g, '').replace(/\(.*?\)/g, '').trim();
}

function extractBrand(title) {
    var t = title.toLowerCase();
    if (t.indexOf('jordan') >= 0) return 'jordan';
    if (t.indexOf('yeezy') >= 0) return 'yeezy';
    if (t.indexOf('dunk') >= 0 || t.indexOf('air force') >= 0 || t.indexOf('air max') >= 0 || t.indexOf('vomero') >= 0 || t.indexOf('nike') >= 0) return 'nike';
    if (t.indexOf('samba') >= 0 || t.indexOf('campus') >= 0 || t.indexOf('gazelle') >= 0 || t.indexOf('adidas') >= 0 || t.indexOf('spezial') >= 0 || t.indexOf('forum') >= 0 || t.indexOf('superstar') >= 0) return 'adidas';
    if (t.indexOf('new balance') >= 0 || t.indexOf('new-balance') >= 0) return 'new balance';
    if (t.indexOf('asics') >= 0 || t.indexOf('gel-') >= 0 || t.indexOf('gel ') >= 0) return 'asics';
    if (t.indexOf('ugg') >= 0) return 'ugg';
    if (t.indexOf('puma') >= 0) return 'puma';
    if (t.indexOf('converse') >= 0) return 'converse';
    if (t.indexOf('salomon') >= 0) return 'salomon';
    return 'other';
}

function compareProducts() {
    var kpSkus = new Set();
    var kpNorms = new Set();
    for (var i = 0; i < kpProducts.length; i++) {
        if (kpProducts[i].sku) kpSkus.add(kpProducts[i].sku.toUpperCase());
        kpNorms.add(kpProducts[i].titleNorm);
    }
    var kpWords = {};
    for (var i = 0; i < kpProducts.length; i++) {
        var words = kpProducts[i].titleNorm.split(' ').filter(function(w) { return w.length > 2; });
        for (var j = 0; j < words.length; j++) {
            if (!kpWords[words[j]]) kpWords[words[j]] = [];
            kpWords[words[j]].push(i);
        }
    }
    missingProducts = [];
    var matched = 0;
    for (var i = 0; i < wtnProducts.length; i++) {
        var wtn = wtnProducts[i];
        var wtnNorm = normalizeTitle(wtn.title);
        var found = false;
        if (wtn.sku && kpSkus.has(wtn.sku.toUpperCase())) found = true;
        if (!found && kpNorms.has(wtnNorm)) found = true;
        if (!found) {
            var wtnWords = wtnNorm.split(' ').filter(function(w) { return w.length > 2 && ['the','retro','high','low','mid'].indexOf(w) < 0; });
            var bestScore = 0;
            var candidates = {};
            for (var j = 0; j < wtnWords.length; j++) {
                var indices = kpWords[wtnWords[j]] || [];
                for (var k = 0; k < indices.length; k++) {
                    if (!candidates[indices[k]]) candidates[indices[k]] = 0;
                    candidates[indices[k]]++;
                }
            }
            for (var idx in candidates) {
                var score = candidates[idx] / Math.max(wtnWords.length, 1);
                if (score > bestScore) bestScore = score;
            }
            if (bestScore >= 0.7) found = true;
        }
        if (found) { matched++; }
        else {
            wtn.brand = extractBrand(wtn.title);
            wtn.goatImages = null;
            missingProducts.push(wtn);
        }
    }
    missingProducts.sort(function(a, b) {
        if (a.brand !== b.brand) return a.brand < b.brand ? -1 : 1;
        return a.title < b.title ? -1 : 1;
    });
    document.getElementById("wtnTotal").textContent = wtnProducts.length;
    document.getElementById("kpTotal").textContent = kpProducts.length;
    document.getElementById("missingTotal").textContent = missingProducts.length;
    document.getElementById("matchTotal").textContent = matched;
}

// ==================== GOAT SCAN ====================

function startGoatScan() {
    if (goatScanning) return;
    goatScanning = true;
    goatAbort = false;
    var btn = document.getElementById("btnGoat");
    var stopBtn = document.getElementById("btnStopGoat");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-sm"></span> Scan en cours...';
    stopBtn.disabled = false;
    document.getElementById("goatProg").style.display = "block";

    var total = missingProducts.length;
    var scanned = 0;
    var kept = 0;
    var removed = 0;
    var notfound = 0;
    var keptProducts = [];

    function updateGoatUI(currentTitle) {
        var pct = total > 0 ? Math.round((scanned / total) * 100) : 0;
        document.getElementById("goatBar").style.width = pct + "%";
        document.getElementById("goatStatus").textContent = scanned + " / " + total + " (" + pct + "%)";
        document.getElementById("goatStats").innerHTML =
            '<span class="kept">&#9989; ' + kept + ' gard\u00e9s (2+ imgs)</span>' +
            '<span class="removed">&#10060; ' + removed + ' retir\u00e9s (0-1 img)</span>' +
            '<span class="notfound">&#9888; ' + notfound + ' introuvables</span>';
        if (currentTitle) {
            document.getElementById("goatCurrent").textContent = "\u27a4 " + currentTitle;
        }
    }
    updateGoatUI('');

    // Copy the array so we iterate over original while building new
    var toScan = missingProducts.slice();

    function scanNext(index) {
        if (goatAbort || index >= toScan.length) {
            // Done
            missingProducts = keptProducts;
            missingProducts.sort(function(a, b) {
                if ((b.goatImages || 0) !== (a.goatImages || 0)) return (b.goatImages || 0) - (a.goatImages || 0);
                return a.title < b.title ? -1 : 1;
            });
            goatScanning = false;
            btn.innerHTML = "&#9989; Scan GOAT termin\u00e9";
            btn.style.background = "#e8e8ed";
            btn.style.color = "#248a3d";
            stopBtn.disabled = true;
            document.getElementById("missingTotal").textContent = missingProducts.length;
            document.getElementById("goatBar").style.width = "100%";
            document.getElementById("goatCurrent").textContent = "";
            displayCount = 50;
            filterResults();
            showMsg(kept + " produits avec 2+ images GOAT !", "ok");
            // Build SKU list
            buildSkuList(keptProducts);
            return;
        }

        var p = toScan[index];
        updateGoatUI(p.title);

        // Build the API URL: use SKU if available, otherwise use title
        var apiUrl;
        if (p.sku) {
            apiUrl = "/api/goat/check-by-name?sku=" + encodeURIComponent(p.sku) + "&name=" + encodeURIComponent(p.title);
        } else {
            apiUrl = "/api/goat/check-by-name?name=" + encodeURIComponent(p.title);
        }

        fetch(apiUrl)
            .then(function(r) { return r.json(); })
            .then(function(d) {
                scanned++;
                if (d.goat_found && d.goat_images > 1) {
                    p.goatImages = d.goat_images;
                    p.goatName = d.goat_name || '';
                    if (d.goat_sku && !p.sku) p.sku = d.goat_sku;
                    keptProducts.push(p);
                    kept++;
                } else if (!d.goat_found) {
                    notfound++;
                } else {
                    removed++;
                }
                updateGoatUI('');
                // Live refresh grid every 10
                if (scanned % 10 === 0) {
                    missingProducts = keptProducts.slice();
                    missingProducts.sort(function(a, b) {
                        if ((b.goatImages || 0) !== (a.goatImages || 0)) return (b.goatImages || 0) - (a.goatImages || 0);
                        return a.title < b.title ? -1 : 1;
                    });
                    document.getElementById("missingTotal").textContent = missingProducts.length + " (scan: " + scanned + "/" + total + ")";
                    filterResults();
                }
                setTimeout(function() { scanNext(index + 1); }, 400);
            })
            .catch(function(e) {
                scanned++;
                notfound++;
                updateGoatUI('');
                setTimeout(function() { scanNext(index + 1); }, 400);
            });
    }
    scanNext(0);
}

function stopGoatScan() {
    goatAbort = true;
    document.getElementById("btnStopGoat").disabled = true;
    document.getElementById("goatStatus").textContent += " (arr\u00eat...)";
}

// ==================== DISPLAY ====================

function showResults() {
    document.getElementById("resultsSection").style.display = "block";
    displayCount = 50;
    filterResults();
}

function setBrandFilter(brand) {
    currentBrand = brand;
    document.querySelectorAll('.btn-filter').forEach(function(b) {
        b.className = 'btn-sm btn-filter' + (b.dataset.brand === brand ? ' active' : '');
    });
    displayCount = 50;
    filterResults();
}

function filterResults() {
    var q = document.getElementById("q").value.toLowerCase();
    var filtered = [];
    for (var i = 0; i < missingProducts.length; i++) {
        var p = missingProducts[i];
        if (q && p.title.toLowerCase().indexOf(q) < 0) continue;
        if (currentBrand !== 'all' && p.brand !== currentBrand) continue;
        filtered.push(p);
    }
    document.getElementById("resultCount").textContent = filtered.length + " produit" + (filtered.length > 1 ? "s" : "") + " manquant" + (filtered.length > 1 ? "s" : "");
    var show = filtered.slice(0, displayCount);
    var html = "";
    for (var i = 0; i < show.length; i++) {
        var p = show[i];
        html += '<div class="card">';
        if (p.image) html += '<img src="' + p.image + '" loading="lazy" onerror="this.style.display=\'none\'">';
        html += '<div class="card-body">';
        html += '<div class="card-title">' + esc(p.title) + '</div>';
        if (p.sku) html += '<div class="card-sku">' + p.sku + '</div>';
        html += '<span class="card-brand">' + p.brand.toUpperCase() + '</span>';
        if (p.goatImages !== null && p.goatImages !== undefined) {
            html += '<span class="card-goat">&#128248; ' + p.goatImages + ' imgs</span>';
        }
        html += '</div>';
        html += '<div class="card-actions">';
        html += '<a href="' + p.url + '" target="_blank">WTN &#8599;</a>';
        if (p.sku) html += '<a href="https://www.goat.com/search?query=' + encodeURIComponent(p.sku) + '" target="_blank">GOAT &#8599;</a>';
        html += '</div></div>';
    }
    document.getElementById("productGrid").innerHTML = html || '<div style="padding:40px;text-align:center;color:#86868b;grid-column:1/-1">Aucun produit</div>';
    document.getElementById("loadMore").style.display = filtered.length > displayCount ? "block" : "none";
}

function showMore() { displayCount += 50; filterResults(); }
function esc(s) { return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function buildSkuList(products) {
    var skus = [];
    for (var i = 0; i < products.length; i++) {
        if (products[i].sku) skus.push(products[i].sku);
    }
    document.getElementById("skuCount").textContent = skus.length;
    document.getElementById("skuTextarea").value = skus.join("\n");
    document.getElementById("skuListSection").style.display = "block";
    // Scroll to it
    document.getElementById("skuListSection").scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function copySkuList() {
    var ta = document.getElementById("skuTextarea");
    ta.select();
    document.execCommand('copy');
    showMsg("Liste de " + ta.value.split("\n").length + " SKUs copi\u00e9e !", "ok");
}
</script>
</body>
